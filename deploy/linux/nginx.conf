# =============================================================================
# nginx.conf — IIC IT Helpdesk  (reverse proxy + media serving)
# =============================================================================
#
# INSTALL
# ───────
#   sudo cp nginx.conf /etc/nginx/sites-available/iic-helpdesk
#   sudo ln -s /etc/nginx/sites-available/iic-helpdesk \
#              /etc/nginx/sites-enabled/iic-helpdesk
#   sudo nginx -t && sudo systemctl reload nginx
#
# PREREQUISITES
# ─────────────
#   • TLS certificates in /etc/letsencrypt/live/ithelpdesk-iic.cloud-dev.tech/
#     (obtain with: sudo certbot --nginx -d ithelpdesk-iic.cloud-dev.tech)
#   • Backend running on 127.0.0.1:8000  (iic-helpdesk-backend.service)
#   • Frontend running on 127.0.0.1:3000 (iic-helpdesk-frontend.service)
#   • MEDIA_ACCEL_REDIRECT=true in backend/.env when using this config
#     (enables Django to send X-Accel-Redirect instead of streaming bytes)
#
# ALTERNATIVE WITHOUT NGINX
# ─────────────────────────
# If Nginx is not available, set MEDIA_ACCEL_REDIRECT=false and Django will
# serve /media/ directly through Gunicorn. See deploy/linux/README.md.
# =============================================================================

# Upstream servers
upstream django_backend  { server 127.0.0.1:8000; }
upstream nextjs_frontend { server 127.0.0.1:3000; }

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ithelpdesk-iic.cloud-dev.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ithelpdesk-iic.cloud-dev.tech;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ithelpdesk-iic.cloud-dev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ithelpdesk-iic.cloud-dev.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Upload limits ─────────────────────────────────────────────────────────
    # Per-chunk limit — default 2 MB chunks + multipart overhead.
    # Raise to match chunk_size_mb in Admin → Settings → File Uploads.
    client_max_body_size 12M;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    # Long timeout covers chunked uploads and SSE streams.
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    proxy_connect_timeout  10s;

    # ── Static files (Next.js build output) ──────────────────────────────────
    # Serve _next/static/ directly from disk — bypasses Node entirely.
    location /_next/static/ {
        alias /var/www/iic-app/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Protected media (X-Accel-Redirect) ───────────────────────────────────
    # Django sends:  X-Accel-Redirect: /protected-media/<path>
    # Nginx serves the bytes — zero Django worker overhead for large files.
    #
    # Requires MEDIA_ACCEL_REDIRECT=true in backend/.env.
    # The /protected-media/ location is internal — never publicly accessible.
    location /protected-media/ {
        internal;
        alias /var/www/iic-app/backend/media/;
        expires 1h;
        add_header Cache-Control "private";
    }

    # ── Django backend (API + admin + media fallback) ─────────────────────────
    location /api/ {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;   # required for SSE (streaming responses)
    }

    location /admin/ {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /media/ {
        # With MEDIA_ACCEL_REDIRECT=true Django sends X-Accel-Redirect and
        # Nginx serves from /protected-media/ (internal, above).
        # This block handles the initial request routing to Django so the
        # download views can authenticate the request first.
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Next.js frontend (everything else) ───────────────────────────────────
    location / {
        proxy_pass         http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering    off;   # required for SSE streams from Next.js route handlers
        proxy_read_timeout 120s;
    }
}

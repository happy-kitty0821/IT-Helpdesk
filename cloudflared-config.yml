# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Tunnel configuration — IIC IT Helpdesk
#
# DEPLOYMENT
# ──────────
# Copy this file to the server as:
#   /etc/cloudflared/config.yml
#
# Then reload the tunnel:
#   sudo systemctl restart cloudflared
#
# WHAT THIS FIXES
# ───────────────
# By default cloudflared buffers entire request bodies before forwarding them
# to the origin.  For large chunk uploads (even at 2 MB) this can cause:
#   • 502 Bad Gateway — if the buffer flush takes longer than cloudflared's
#     internal read timeout
#   • Slow uploads — because Django only starts processing after the full
#     chunk arrives at cloudflared's buffer
#
# Setting noChunkedEncoding: false tells cloudflared to stream the body
# directly to the origin as it arrives, eliminating both problems.
#
# SSE (Server-Sent Events)
# ────────────────────────
# SSE streams are long-lived HTTP/1.1 connections that stay open for minutes
# or hours.  The keepAliveTimeout must be long enough to outlast any SSE
# session.  90s was too short — connections were terminated at ~150s.
#
# DO NOT set http2Origin: true for local HTTP/1.1 origins (Next.js, Django).
# HTTP/2 stream idle timeouts (~130s) apply per-stream and cannot be disabled,
# causing SSE to drop every ~130s.  HTTP/1.1 with a high keepAliveTimeout is
# the correct configuration.
# ─────────────────────────────────────────────────────────────────────────────

tunnel: <YOUR_TUNNEL_ID>
credentials-file: /etc/cloudflared/<YOUR_TUNNEL_ID>.json

# ── Origin connection settings ────────────────────────────────────────────────
originRequest:
  # Stream the request body to the origin instead of buffering it first.
  # Critical for file upload endpoints — eliminates 502 on large PUT requests.
  noChunkedEncoding: false

  # How long cloudflared waits for the origin to respond to a connection
  # attempt before giving up.
  connectTimeout: 30s

  # How long cloudflared keeps an idle origin connection alive.
  # Set to 1 hour to accommodate long-lived SSE streams.
  # Previously 90s which caused SSE connections to drop at ~150s.
  keepAliveTimeout: 3600s

  # Number of idle origin connections to keep in the pool.
  keepAliveConnections: 100

  # TCP keepalive probe interval — keeps the underlying TCP connection alive
  # through NAT and firewall state tables.
  tcpKeepAlive: 30s

  # IMPORTANT: do NOT set http2Origin: true here or per-hostname.
  # Next.js and Gunicorn both speak HTTP/1.1 on localhost.
  # HTTP/2 forces stream-level idle timeouts (~130s) that cannot be
  # disabled and break SSE streams.

# ── Ingress rules ─────────────────────────────────────────────────────────────
ingress:
  # All traffic goes to the local Next.js frontend (port 3000).
  # Next.js proxies /api/v1/* to Django (port 8000) via next.config.ts rewrites.
  - hostname: ithelpdesk-iic.cloud-dev.tech
    service: http://127.0.0.1:3000

  # Direct backend access (for debugging / API testing without the frontend proxy)
  - hostname: ithelpdesk-backend.cloud-dev.tech
    service: http://127.0.0.1:8000

  # Catch-all (required by cloudflared — returns 404 for unmatched hosts)
  - service: http_status:404

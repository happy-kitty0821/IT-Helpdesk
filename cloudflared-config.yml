# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Tunnel configuration — IIC IT Helpdesk
#
# DEPLOYMENT
# ──────────
# Copy this file to the server as:
#   /etc/cloudflared/config.yml
#
# Then reload the tunnel:
#   sudo systemctl restart cloudflared
#
# SSE NOTES
# ─────────
# keepAliveTimeout: 3600s  — keeps origin connections alive for 1 hour so
#   SSE streams don't get cut at ~130s (the old 90s value caused this).
#
# DO NOT set http2Origin: true — Next.js and Gunicorn both speak HTTP/1.1
#   on localhost. Forcing HTTP/2 imposes a ~130s stream idle timeout that
#   cannot be disabled and kills SSE connections silently.
# ─────────────────────────────────────────────────────────────────────────────

tunnel: <YOUR_TUNNEL_ID>
credentials-file: /etc/cloudflared/<YOUR_TUNNEL_ID>.json

# ── Origin connection settings ────────────────────────────────────────────────
originRequest:
  # Stream the request body to the origin instead of buffering it first.
  # Critical for file upload endpoints — eliminates 502 on large PUT requests.
  noChunkedEncoding: false

  # How long cloudflared waits for the origin to respond to a connection
  # attempt before giving up.
  connectTimeout: 30s

  # How long cloudflared keeps an idle origin connection alive.
  # 3600s (1 hour) — required for long-lived SSE streams.
  # The original 90s value was causing SSE to terminate at ~150s.
  keepAliveTimeout: 3600s

  # Number of idle origin connections to keep in the pool.
  keepAliveConnections: 100

  # TCP keepalive probe interval — keeps the underlying TCP connection alive
  # through NAT and firewall state tables.
  tcpKeepAlive: 30s

# ── Ingress rules ─────────────────────────────────────────────────────────────
ingress:
  # All traffic goes to the local Next.js frontend (port 3000).
  # Next.js proxies /api/v1/* to Django (port 8000) via next.config.ts rewrites.
  - hostname: ithelpdesk-iic.cloud-dev.tech
    service: http://127.0.0.1:3000

  # Direct backend access (for debugging / API testing without the frontend proxy)
  - hostname: ithelpdesk-backend.cloud-dev.tech
    service: http://127.0.0.1:8000

  # Catch-all (required by cloudflared — returns 404 for unmatched hosts)
  - service: http_status:404
